name: Django Tests

on:
  push:
    branches: [ master, tests ]
  pull_request:
    branches: [ master, tests ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testuser
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      DJANGO_SETTINGS_MODULE: websiteProject.settings

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          
          pip install psycopg2-binary # Додайте це на випадок, якщо його немає в requirements.txt

      - name: Wait for Postgres to be fully ready
        run: |
          echo "Waiting for Postgres to be ready and accept connections..."
          
          sleep 5 
          
          for i in $(seq 1 30); do
            
            if pg_isready -h $POSTGRES_HOST -p $POSTGRES_PORT -U $POSTGRES_USER -q; then
              echo "Postgres is ready!"
              break
            fi
            echo "Postgres not ready yet, waiting 2 seconds... (Attempt $i/30)"
            sleep 2
            
            if [ $i -eq 30 ]; then
              echo "Error: Postgres did not become ready within the allotted time."
              exit 1
            fi
          done
          
      - name: Run Django Migrations
        run: |
            python manage.py migrate
          
      - name: Run Django Tests
        run: |
            python manage.py test