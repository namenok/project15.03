version: '3.9'

services:
  db:
    image: postgres:15
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    platform: linux/amd64
    command: serve
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_ORIGINS: "*"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  web:
    build: .
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             uvicorn websiteProject.asgi:application --host 0.0.0.0 --port 8000 --reload --log-level debug"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
       db:
        condition: service_started
       ollama:
        condition: service_healthy
    env_file:
      - .env
    environment:
      OLLAMA_API_BASE_URL: http://ollama:11434/api/


  test:
    build: .
    command: pytest
    volumes:
      - .:/app
    depends_on:
      - web
    env_file:
      - .env
    working_dir: /app

volumes:
  postgres_data:
  ollama_models: