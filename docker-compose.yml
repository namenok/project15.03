services:
  db:
    image: postgres:15
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    platform: linux/amd64
    command: serve
    volumes:
      - ollama_models:/root/.ollama
      - ./ollama-entrypoint.sh:/entrypoint.sh
    entrypoint: ["/entrypoint.sh"]
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_ORIGINS: "*"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  web:
    build: .
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             uvicorn websiteProject.asgi:application --host 0.0.0.0 --port 8000 --reload --log-level debug"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
       db:
        condition: service_healthy
       ollama:
        condition: service_healthy
    env_file:
      - .env
    environment:
      OLLAMA_API_BASE_URL: http://ollama:11434/api/


  test:
    build: .
    command: >
      sh -c "
        python manage.py wait_for_db &&

        # Terminate connections to test DB (replace 'test_mainappdb' with your actual test DB name if different)
        psql -U $${POSTGRES_USER} -h db -d postgres -c \"SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='test_mainappdb' AND pid <> pg_backend_pid();\" &&

        # Drop test database if exists
        psql -U $${POSTGRES_USER} -h db -d postgres -c \"DROP DATABASE IF EXISTS test_mainappdb;\" &&

        # Run migrations and tests
        python manage.py migrate &&
        pytest
      "
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    env_file:
      - .env
    working_dir: /app


volumes:
  postgres_data:
  ollama_models: