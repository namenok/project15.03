<!DOCTYPE html>
<html lang="en">
{% load static %}
{% include 'menu.html' %}
  <head>
      <link rel="icon" href="{% static 'favicon.ico' %}" />
      <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link id="theme-light" rel="stylesheet" href="{% static 'css/light-theme.css' %}">
    <link id="theme-dark" rel="stylesheet" href="{% static 'css/dark-theme.css' %}" disabled>
    <link href="https://fonts.googleapis.com/css2?family=Raleway&display=swap&subset=cyrillic" rel="stylesheet">
  </head>

{% block extra_scripts %}{% endblock %}

{% block styles %}{% endblock %}

<body>

    <main role="main" class="container">
      {% block content %}
      {% endblock %}
    </main>

</body>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const lightTheme = document.getElementById('theme-light');
    const darkTheme = document.getElementById('theme-dark');
    const toggleButton = document.getElementById('theme-toggle');

    function applyTheme(theme) {
      if (!lightTheme || !darkTheme || !toggleButton) return;

      if (theme === 'dark') {
        lightTheme.disabled = true;
        darkTheme.disabled = false;
        toggleButton.textContent = '🌞';
      } else {
        lightTheme.disabled = false;
        darkTheme.disabled = true;
        toggleButton.textContent = '🌙';
      }

      localStorage.setItem('theme', theme);
    }

    // Встановлення теми при першому завантаженні
    const savedTheme = localStorage.getItem('theme') || 'light';
    applyTheme(savedTheme);

    // Перемикання теми при натисканні
    if (toggleButton) {
      toggleButton.addEventListener('click', function () {
        const newTheme = darkTheme.disabled ? 'dark' : 'light';
        applyTheme(newTheme);
      });
    }
  });

</script>
</html>
