{% extends 'base.html' %}

{% block content %}
<h2 style="text-align: center;">Chat with a mini therapist</h2>
<div id="chat-window">
  <div id="chat-messages"></div>
</div>
<form id="chat-form" autocomplete="off">
  <input id="chat-input" type="text" placeholder="Напиши щось..." required />
  <button type="submit">Надіслати</button>
</form>

{% endblock %}

{% block extra_scripts %}
<script>
const socket = new WebSocket('ws://' + window.location.host + '/ws/chat/');

let chatMessages;
let aiMessageDiv;
let fullResponse = '';

function sendMessage(msg) {
    socket.send(JSON.stringify({'message': msg}));
}

function appendMessage(sender, text) {
    const message = document.createElement('div');
    message.classList.add('message', sender);
    message.textContent = text;
    chatMessages.appendChild(message);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

document.addEventListener('DOMContentLoaded', function() {
    chatMessages = document.getElementById('chat-messages');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('chat-input');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const userMessage = input.value.trim();
        if (!userMessage) return;

        appendMessage('user', userMessage);
        sendMessage(userMessage);
        input.value = '';

        // Показуємо "генерується відповідь"
        aiMessageDiv = document.createElement('div');
        aiMessageDiv.classList.add('message', 'ai');
        aiMessageDiv.textContent = '🤖 Генерується відповідь...';
        chatMessages.appendChild(aiMessageDiv);
        fullResponse = '';
    });
});

socket.onmessage = function(e) {
    const data = JSON.parse(e.data);
    const chunk = data.reply;

    if (chunk) {
        fullResponse += chunk;
        aiMessageDiv.textContent = fullResponse;
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
};

socket.onopen = function() {
    console.log('WebSocket connection opened');
};

socket.onerror = function(e) {
    console.error('WebSocket error', e);
};

socket.onclose = function(e) {
    console.log('WebSocket closed', e);
};
</script>

{% endblock %}

{% block styles %}
<style>
#chat-window {
    width: 100%;
    max-width: 600px;
    margin: 0 auto 15px auto; /* центр по горизонталі */
    border: 1px solid #ccc;
    border-radius: 10px;
    height: 400px;
    padding: 10px;
    overflow-y: auto;
    background-color: #f9f9f9;
}

#chat-messages {
    display: flex;
    flex-direction: column;
    gap: 10px;
    height: 100%;
}

.message {
    padding: 8px 12px;
    border-radius: 10px;
    max-width: 70%;
    word-wrap: break-word;
    font-size: 14px;
}

.user {
    align-self: flex-end;
    background-color: #d1e7dd;
    border: 1px solid #badbcc;
}

.ai {
    align-self: flex-start;
    background-color: #e2e3e5;
    border: 1px solid #d3d6d8;
}

#chat-form {
    display: flex;
    gap: 10px;
    max-width: 600px;
    margin: 0 auto;
}

#chat-input {
    flex-grow: 1;
    padding: 8px;
    font-size: 14px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

#chat-form button {
    padding: 8px 16px;
    font-size: 14px;
    border-radius: 6px;
    border: none;
    background-color: #28a745;
    color: white;
    cursor: pointer;
}

#chat-form button:hover {
    background-color: #218838;
}

</style>
{% endblock %}
