{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="post-form-container">
  <h2 class="post-form-title">
    {% if form.instance.pk %}
        {% trans "ти редагуєш пост, який вже існує на сьогодні." %}
    {% else %}
        {% trans "новий запис на сьогодні" %}
    {% endif %}
  </h2>

  <form method="post" enctype="multipart/form-data" class="post-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="submit-button">{% trans "зберегти" %}</button>
  </form>

  <div class="back-link">
    <a href="{% url 'mainapp:post_history' %}">{% trans "історія" %}</a>
  </div>
</div>
{% endblock %}
