{% extends 'base.html' %}
{% load i18n %}

{% block content %}
  <h2 class="mb-4 page-header">{% trans "історія твоїх постів" %}</h2>
  <a href="{% url 'mainapp:daily_post' %}">{% trans "редагувати/створити" %}</a>
  <div class="post-history">
    {% for post in posts %}
      <div class="post-card">
        <h5 class="post-title mb-2">{{ post.title }}</h5>
        <p class="post-content mb-2">{{ post.content }}</p>
        <p class="post-date small">{{ post.date }}</p>
      </div>
    {% empty %}
      <p class="text-muted">{% trans "постів немає" %}</p>
    {% endfor %}
  </div>
{% endblock %}
