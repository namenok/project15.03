{% extends 'base.html' %}
{% load i18n %}
{% block content %}

<h2 class="mb-4">{% trans "історія твоїх постів" %}</h2>

<div class="post-history">
  {% for post in posts %}
    <div class="post-card mb-3 p-3">
      <h5 class="post-title">{{ post.title }}</h5>
      <p class="post-content">{{ post.content }}</p>
      <p class="post-date text-muted small">{{ post.date }}</p>
    </div>
  {% empty %}
    <p>{% trans "постів немає" %}</p>
  {% endfor %}
</div>

{% endblock %}
