<style>
  .nav-item.active > .nav-link {
    background-color: #555;
    color: #fff !important;
    border-radius: 4px;
  }
</style>

<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-left">
  <a class="navbar-brand" href="#"></a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarsExampleDefault"
          aria-controls="navbarsExampleDefault" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarsExampleDefault">
    <ul class="navbar-nav mr-auto">
      {% if request.user.is_authenticated %}
        <li class="nav-item {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
          <a class="nav-link" href="{% url 'mainapp:home' %}">мійКабінет-домашня</a>
        </li>
        <li class="nav-item {% if request.resolver_match.url_name == 'calendar_combined' %}active{% endif %}">
          <a class="nav-link" href="{% url 'mainapp:calendar_combined' %}">Календар</a>
        </li>
        <li class="nav-item {% if request.resolver_match.url_name == 'library_category_list' %}active{% endif %}">
          <a class="nav-link" href="{% url 'mainapp:library_category_list' %}">Бібліотека</a>
        </li>
        <li class="nav-item {% if request.resolver_match.url_name == 'checkme' %}active{% endif %}">
          <a class="nav-link" href="{% url 'mainapp:checkme' %}">ПеревірСебе</a>
        </li>
        <li class="nav-item {% if request.resolver_match.url_name == 'gallery' %}active{% endif %}">
          <a class="nav-link" href="{% url 'gallery:gallery' %}">Галерея</a>
        </li>
        <li class="nav-item {% if request.resolver_match.url_name == 'daily_post' %}active{% endif %}">
          <a class="nav-link" href="{% url 'mainapp:daily_post' %}">ЩоденніДумкиЗаписати</a>
        </li>
      {% endif %}
    </ul>

    <nav class="nav">
      {% if request.user.is_authenticated %}
        <a href="#" class="nav-item nav-link">Hi {{ request.user|title }}</a>
        <a href="{% url 'users:users_profile' %}" class="nav-item nav-link">Profile</a>
        <a href="{% url 'users:logout' %}" class="btn btn-outline">Logout</a>
      {% else %}
        <a href="{% url 'users:login' %}" class="btn btn-outline">Login</a>
        <a href="{% url 'users:register' %}" class="btn btn-outline">Sign up</a>
      {% endif %}
    </nav>
  </div>
</nav>
